name: Approve qualification candidates

on:
  workflow_dispatch:
    inputs:
      candidate_ids:
        description: Comma-separated review candidate IDs approved by the Games28 owner
        required: true
        type: string
      resolution_note:
        description: Audit note stored with the approval
        required: false
        default: Approved by the repository owner through a manually dispatched GitHub Action.
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Approve explicitly authorized candidates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVIEW_CANDIDATE_IDS: ${{ inputs.candidate_ids }}
          REVIEW_RESOLUTION_NOTE: ${{ inputs.resolution_note }}
        run: node scripts/approve-review-candidates.mjs
