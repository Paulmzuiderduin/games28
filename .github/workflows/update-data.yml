name: Refresh Games28 Data

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: write
  contents: write

concurrency:
  group: games28-data-refresh
  cancel-in-progress: true

jobs:
  update_dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # Restore any historical approval that an older sync accidentally reset
      # before the refresh decides which confirmed records stay public.
      - name: Protect resolved qualification reviews
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-review-candidates-to-supabase.mjs

      - name: Refresh datasets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run data:update

      - name: Discover possible official qualifications on the web
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          # 24 daily searches is about 720 per 30-day month, below the current
          # monthly credit allowance while the system is in its first rollout.
          BRAVE_SEARCH_MAX_QUERIES: '24'
        run: node scripts/discover-qualification-search.mjs

      - name: Sync newly found qualification reviews
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-review-candidates-to-supabase.mjs

      - name: Commit and push when data changed
        id: publish_data
        run: |
          if git diff --quiet -- src/data public; then
            echo "No data changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data public
          git commit -m "chore(data): refresh Games28 datasets"

          TARGET_BRANCH="${GITHUB_REF_NAME:-main}"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! git pull --rebase --autostash origin "${TARGET_BRANCH}"; then
              echo "Skipping after rebase conflict."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "Could not push after retries."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Deploy refreshed data
        if: steps.publish_data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME:-main}"
